[project]
name = "streak_saver"
version = "0.1.11"
description = "CLI app that automatically messages your friends on the tik tok and saves your streak."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "playwright>=1.58.0",
    "typer>=0.24.1",
    "pyautostart>=0.1.2",
    "rich>=13.9.0",
    "uvicorn[standard]>=0.34.0"
]

[project.scripts]
streak-saver = "streak_saver.main:app"

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"
